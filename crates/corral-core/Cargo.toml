[package]
name = "corral-core"
description = "Worktree, git, and session logic shared by the corral GUI and CLI"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
dirs = "6"
rand = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
base64 = { workspace = true }
globset = "0.4"
ignore = "0.4"
notify = "8"
ureq = { version = "3", features = ["json"] }
url = "2"

# Linux is used for `PR_SET_PDEATHSIG` (caffeinate); macOS/all-unix for the
# `getpwuid_r` login-shell lookup in `shell_env`.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
