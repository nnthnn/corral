name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Same deps Tauri v2 needs to compile its Linux (webkit2gtk) runtime —
      # required even for `cargo check`/`clippy`/`test`, not just bundling.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry/build
        uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - uses: extractions/setup-just@v2

      # Mirrors `just ci` (fmt-check lint check frontend test) so local and
      # CI verification never drift apart.
      - name: Format check
        run: just fmt-check
      - name: Lint
        run: just lint
      - name: Rust check
        run: just check
      - name: Frontend build
        run: just frontend
      - name: Test
        run: just test

  # The Linux job is the real gate, but macOS-only code (the caffeinate
  # inhibitor, the `/proc` fallbacks in process/session handling) sits behind
  # `cfg(target_os = "macos")` and would otherwise never be compiled before a
  # release. This job only needs to type-check, so it skips the frontend
  # toolchain and the full `just ci` suite.
  macos-check:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry/build
        uses: Swatinem/rust-cache@v2
      - name: Rust check
        run: cargo check --workspace --all-targets
