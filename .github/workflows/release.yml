name: Release

# Builds the Linux bundles (.deb / .rpm / .AppImage) and publishes a GitHub
# Release whenever a vX.Y.Z tag is pushed. The tag is created by
# scripts/bump-version.sh, so the version in Cargo.toml and the tag are
# expected to agree — verified in each job before spending time bundling.
#
# macOS is NOT built here. macOS runners are the one standard runner GitHub
# doesn't make free on a public repo (a 10x multiplier against an allowance a
# personal account doesn't have), so this workflow only produces the Linux
# bundles. The `.dmg` is built on a Mac with `just bundle` (or `just universal`
# for a fat binary) and attached to the release by hand — see README's
# "Releasing" note. Consequence to keep in mind: nothing in CI compiles the
# `cfg(target_os = "macos")` code, so a Mac-only compile error surfaces only
# when that manual build runs.
#
# Manual runs (Actions → Release → Run workflow) build for inspection and
# never publish.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # softprops/action-gh-release needs this to create the release

# A dry run and a tag push for the same commit share a group, so a
# `workflow_dispatch` fired moments before the tag can't leave its build
# racing the real one. `github.workflow` keeps this scoped to Release runs.
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Is this run allowed to publish, and is there a tag to check the version
  # against? A tag push consults `GITHUB_REF_NAME`; a manual run has no usable
  # ref of that shape, so version verification is skipped there (the tag check
  # below is the only use of `GITHUB_REF_NAME`, so there's nothing to fall
  # back to — and nothing to publish).
  prepare:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ github.event_name == 'push' }}
    steps:
      - name: Explain this run
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "Tag push — will publish a GitHub release for ${{ github.ref_name }}"
          else
            echo "Manual run — building the Linux bundles for inspection only; nothing will be published."
          fi

  linux:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Same deps as ci.yml plus what the Linux bundlers need: rpm for
      # rpmbuild, libfuse2 for AppImage, patchelf + file for linuxdeploy.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libfuse2 \
            rpm \
            file \
            patchelf

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry/build
        uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Guard against a tag that doesn't match the committed version (e.g. a
      # hand-made tag or a bump that was reverted after tagging). Only
      # meaningful on a tag push — see `prepare`.
      - name: Verify tag matches Cargo.toml version
        if: github.event_name == 'push'
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          cargo_version="$(sed -n 's/^version = "\([^"]*\)".*/\1/p' Cargo.toml | head -n1)"
          if [[ "$tag_version" != "$cargo_version" ]]; then
            echo "error: tag '$GITHUB_REF_NAME' does not match version '$cargo_version' in Cargo.toml" >&2
            exit 1
          fi
          echo "Building corral v$cargo_version"

      # `pnpm tauri build` runs the beforeBuildCommand (tsc + vite build) and
      # beforeBundleCommand (scripts/stage-cli-sidecar.sh, which builds and
      # stages the CLI sidecar), then compiles the Rust app and produces the
      # bundles in target/release/bundle/{deb,rpm,appimage}.
      - name: Build release bundles
        run: pnpm tauri build

      # The sidecar is now the *only* way the CLI reaches the packages (the
      # `bundle.linux.*.files` entries are gone), so assert on the packaged
      # copy in every format. A missing or stubbed `corral` still lets all three
      # bundles build successfully and only fails later — at every Claude Code
      # status hook, or for the AppImage at every `corral` invocation, with
      # exit 127.
      - name: Verify the bundled CLI is the real executable
        run: |
          check_cli() {
            local label="$1" path="$2"
            if [[ ! -f "$path" ]]; then
              echo "error: $label does not ship usr/bin/corral" >&2
              exit 1
            fi
            # chmod: extracted files can lose the bit, and an AppImage always
            # carries it, so don't fail on packaging metadata alone.
            chmod +x "$path"
            "$path" --version >/dev/null || {
              echo "error: $label's corral does not run: $(file -b "$path")" >&2
              exit 1
            }
            echo "$label: $("$path" --version)"
          }

          work="$RUNNER_TEMP/verify"
          mkdir -p "$work"

          deb="$(ls target/release/bundle/deb/*.deb | head -n1)"
          dpkg-deb -x "$deb" "$work/deb"
          check_cli deb "$work/deb/usr/bin/corral"

          rpm="$(ls target/release/bundle/rpm/*.rpm | head -n1)"
          (cd "$work" && rpm2cpio "$rpm" | cpio -idm --quiet)
          check_cli rpm "$work/usr/bin/corral"

          # An AppImage is a squashfs image appended to a shell stub, mounted at
          # a fresh /tmp/.mount_* path on every launch — which is exactly why
          # `bin::hook_cli_path` keeps the bare `corral` name for it. Extract
          # the payload rather than mounting, so no FUSE is needed in CI.
          appimage="$(readlink -f "$(ls target/release/bundle/appimage/*.AppImage | head -n1)")"
          (cd "$work" && "$appimage" --appimage-extract >/dev/null)
          check_cli appimage "$work/squashfs-root/usr/bin/corral"

      - name: Upload Linux bundles
        uses: actions/upload-artifact@v7
        with:
          name: linux-bundles
          if-no-files-found: error
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage

  publish:
    # Skipped entirely on a manual run: a dry run must never create a release.
    if: needs.prepare.outputs.publish == 'true'
    # Only depends on the Linux job — the .dmg (if any) is built on a Mac and
    # attached to the release afterwards.
    needs: [prepare, linux]
    runs-on: ubuntu-latest
    steps:
      # Every build job uploads its own artifacts; merge them into one flat
      # directory (the filenames don't collide across platforms) so a single
      # release-publishing step owns creating the release.
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: artifacts/*
