name: Release

# Builds the Linux bundles (.deb / .rpm / .AppImage) and publishes a GitHub
# Release whenever a vX.Y.Z tag is pushed. The tag is created by
# scripts/bump-version.sh, so the version in Cargo.toml and the tag are
# expected to agree — verified below before we spend time bundling.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # softprops/action-gh-release needs this to create the release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Same deps as ci.yml plus what the Linux bundlers need: rpm for
      # rpmbuild, libfuse2 for AppImage, patchelf + file for linuxdeploy.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libfuse2 \
            rpm \
            file \
            patchelf

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry/build
        uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Guard against a tag that doesn't match the committed version (e.g. a
      # hand-made tag or a bump that was reverted after tagging).
      - name: Verify tag matches Cargo.toml version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          cargo_version="$(sed -n 's/^version = "\([^"]*\)".*/\1/p' Cargo.toml | head -n1)"
          if [[ "$tag_version" != "$cargo_version" ]]; then
            echo "error: tag '$GITHUB_REF_NAME' does not match version '$cargo_version' in Cargo.toml" >&2
            exit 1
          fi
          echo "Building corral v$cargo_version"

      # The bundles ship the CLI as /usr/bin/corral, so it has to exist before
      # `pnpm tauri build` runs (see bundle.linux.*.files in tauri.conf.json).
      - name: Build CLI
        run: cargo build --release -p corral-cli

      # `pnpm tauri build` runs the beforeBuildCommand (tsc + vite build) first,
      # then compiles the Rust app and produces the bundles in
      # target/release/bundle/{deb,rpm,appimage} (the workspace target dir).
      - name: Build release bundles
        run: pnpm tauri build

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
